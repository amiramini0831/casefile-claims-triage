[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casefile"
version = "0.1.0"
description = "Multi-agent triage for auto insurance claims with a human approval gate."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "SQLAlchemy>=2.0",
    "PyMySQL[rsa]>=1.1",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
